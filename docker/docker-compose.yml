version: '3.8'

services:
  # Main Langflow backend with frontend
  main:
    build:
      context: ..
      dockerfile: docker/Dockerfile.main
    container_name: langflow-main
    environment:
      - FORWARD_FLOW=true
      - FORWARD_FLOW_URL=http://localhost:8080
      - LANGFLOW_LOCAL_MODE=true
      - LANGFLOW_AUTO_LOGIN=true
      - LANGFLOW_LOG_LEVEL=info
      - LANGFLOW_DATABASE_URL=postgresql+psycopg://langflow:langflow@postgres:5432/langflow
    ports:
      - "7860:7860"
    volumes:
      - ../data:/app/data
    depends_on:
      - nginx
      - postgres
    networks:
      - langflow-network
    restart: unless-stopped

  # First runner backend (worker)
  runner1:
    build:
      context: ..
      dockerfile: docker/Dockerfile.runner
    container_name: langflow-runner1
    environment:
      - LANGFLOW_BACKEND_ONLY=true
      - LANGFLOW_LOCAL_MODE=true
      - LANGFLOW_LOG_LEVEL=info
      - LANGFLOW_WORKER_PORT=7861
      - LANGFLOW_DATABASE_URL=postgresql+psycopg://langflow:langflow@postgres:5432/langflow
      - SQLALCHEMY_POOL_SIZE=50
      - SQLALCHEMY_MAX_OVERFLOW=100
      - SQLALCHEMY_POOL_TIMEOUT=60
    volumes:
      - ../data:/app/data
    networks:
      - langflow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7861/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3



  # Nginx load balancer
  nginx:
    image: nginx:alpine
    container_name: langflow-nginx
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - runner1
    networks:
      - langflow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Postgres database
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: langflow
      POSTGRES_PASSWORD: langflow
      POSTGRES_DB: langflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - langflow-network
    restart: unless-stopped

networks:
  langflow-network:
    driver: bridge

volumes:
  data: 
  postgres-data: