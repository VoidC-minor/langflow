version: '3.8'

services:
  # Main Langflow backend with frontend
  main:
    build:
      context: ..
      dockerfile: docker/Dockerfile.main
    container_name: langflow-main
    environment:
      - FORWARD_FLOW=true
      - FORWARD_FLOW_URL=http://nginx:8080/api/v1/flow/run
      - LANGFLOW_LOCAL_MODE=true
      - LANGFLOW_AUTO_LOGIN=true
      - LANGFLOW_LOG_LEVEL=info
    ports:
      - "7860:7860"
    volumes:
      - ../data:/app/data
    depends_on:
      - nginx
    networks:
      - langflow-network
    restart: unless-stopped

  # First runner backend (worker)
  runner1:
    build:
      context: ..
      dockerfile: docker/Dockerfile.runner
    container_name: langflow-runner1
    environment:
      - LANGFLOW_BACKEND_ONLY=true
      - LANGFLOW_LOCAL_MODE=true
      - LANGFLOW_LOG_LEVEL=info
      - LANGFLOW_WORKER_PORT=7861
    volumes:
      - ../data:/app/data
    networks:
      - langflow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7861/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3



  # Nginx load balancer
  nginx:
    image: nginx:alpine
    container_name: langflow-nginx
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - runner1
    networks:
      - langflow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  langflow-network:
    driver: bridge

volumes:
  data: 